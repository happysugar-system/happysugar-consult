<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>問い合わせ管理 | Happy sugar</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#23344c;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px}h2{font-size:19px}.card{background:#fff;border-radius:15px;padding:22px;margin:15px 0;box-shadow:0 5px 22px #1b3b5510}input,textarea,select,button{font:inherit;padding:11px;border:1px solid #b9c9d8;border-radius:8px;max-width:100%}input,textarea{width:100%;margin:5px 0 12px}button{background:#1759a1;color:white;border:0;cursor:pointer}button.secondary{background:#e7eef7;color:#243b55}button:disabled{opacity:.5}label{font-weight:600;display:block}.muted{color:#62768b}.item{display:block;text-align:left;background:white;color:#23344c;width:100%;border:1px solid #dbe4ec;padding:15px;margin:8px 0}.item:hover{background:#eff6ff}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1.2fr;gap:16px}.hidden{display:none!important}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.7}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#e6f0ff;font-size:12px}#notice{min-height:24px;color:#a22}small{color:#62768b}@media(max-width:700px){.two{grid-template-columns:1fr}header{align-items:flex-start}h1{font-size:20px}}</style><link rel="manifest" href="/manifest.webmanifest?v=4"><link rel="icon" type="image/png" href="/happysugar-icon-original.png?v=4"><link rel="apple-touch-icon" sizes="512x512" href="/happysugar-icon-original.png?v=4"><meta name="theme-color" content="#e76b9c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HS 業務管理"></head><body><div class="wrap"><header><div><h1>Happy sugar｜問い合わせ管理</h1><a href="portal.html" style="color:#1759a1;text-decoration:none">← 業務改善アプリ ホーム</a><small>管理者専用</small></div><button class="secondary hidden" id="logout">ログアウト</button></header><p id="notice" role="status"></p><section id="login" class="card"><h2>管理者ログイン</h2><form id="loginForm"><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button>ログイン</button></form><p class="muted">管理者として許可されたアカウントのみ閲覧できます。</p></section><section id="app" class="hidden"><div class="card flex"><strong id="count">問い合わせ一覧</strong><button class="secondary" id="refresh">更新</button></div><div class="two"><div id="items"></div><section id="detail" class="card"><p class="muted">問い合わせを選択してください。</p></section></div></section></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const base='https://mceoggpycmwkddfzlana.supabase.co',api=base+'/functions/v1/consultation-admin-api',db=createClient(base,"sb_publishable_qWnMT6z9QE3Wyfxme8hw2g_AYcD4rZ0",{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}});
const el=id=>document.getElementById(id),notice=t=>el('notice').textContent=t,show=(id,on)=>el(id).classList.toggle('hidden',!on);
let rows=[],selected=null;
const labels={new:'未対応',in_progress:'対応中',done:'完了'};
async function request(action,extra={}){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('ログインしてください');const r=await fetch(api,{method:'POST',headers:{'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});const j=await r.json();if(!r.ok)throw Error(j.error||'通信エラー');return j}
function node(tag,text){const e=document.createElement(tag);e.textContent=text??'';return e}
function line(parent,label,value){const p=node('p',label+'：'+(value||'—'));parent.append(p)}
async function refresh(){const d=await request('list');rows=d.items||[];el('items').replaceChildren();el('count').textContent='問い合わせ '+rows.length+'件（最新200件）';for(const row of rows){const c=row.hs_customers||{};const b=node('button',(c.company_name||c.contact_name||'お客様')+' ｜ '+(row.consultation_type||'相談')+' ｜ '+(labels[row.status]||row.status)+' ｜ '+new Date(row.created_at).toLocaleString('ja-JP'));b.className='item';b.onclick=()=>detail(row.id);el('items').append(b)}if(selected&&rows.some(r=>r.id===selected))await detail(selected);else if(rows.length)await detail(rows[0].id);else el('detail').replaceChildren(node('p','問い合わせはありません。'))}
async function detail(id){selected=id;const r=rows.find(x=>x.id===id);if(!r)return;const c=r.hs_customers||{},p=el('detail');p.replaceChildren(node('h2','問い合わせ詳細'));line(p,'受付日時',new Date(r.created_at).toLocaleString('ja-JP'));line(p,'お名前',c.contact_name);line(p,'会社名',c.company_name);line(p,'メール',c.email);if(c.email){const gmail=document.createElement('a');gmail.href='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(c.email)+'&su='+encodeURIComponent('【Happy sugar】お問い合わせありがとうございます');gmail.target='_blank';gmail.rel='noopener noreferrer';gmail.textContent='✉ Gmailで返信する';gmail.style.cssText='display:inline-block;background:#1759a1;color:white;padding:11px 15px;border-radius:9px;text-decoration:none;margin-bottom:12px';p.append(gmail)}line(p,'電話',c.phone);line(p,'相談種別',r.consultation_type);line(p,'現在の管理方法',r.current_method);p.append(node('h3','相談内容'),node('pre',r.description||'記載なし'));const l=node('label','対応状況');const s=document.createElement('select');for(const [v,t] of Object.entries(labels)){const o=new Option(t,v);s.add(o)}s.value=r.status;s.onchange=async()=>{try{await request('status',{id,status:s.value});r.status=s.value;notice('対応状況を保存しました');}catch(e){notice(e.message);s.value=r.status}};l.append(s);p.append(l,node('h3','対応メモ'));const notes=node('div');p.append(notes);async function loadNotes(){const d=await request('notes',{id});notes.replaceChildren(...d.items.map(n=>node('p',new Date(n.created_at).toLocaleString('ja-JP')+'：'+n.body)))}const t=document.createElement('textarea');t.placeholder='対応内容を記録';t.rows=3;p.append(t);const b=node('button','メモを追加');b.onclick=async()=>{try{await request('add_note',{id,note:t.value});t.value='';await loadNotes();notice('メモを保存しました')}catch(e){notice(e.message)}};p.append(b);await loadNotes()}
async function enter(){try{await refresh();show('login',false);show('app',true);show('logout',true);notice('')}catch(e){notice(e.message);show('login',true);show('app',false);show('logout',false)}}
el('loginForm').onsubmit=async e=>{e.preventDefault();notice('ログイン中…');const {error}=await db.auth.signInWithPassword({email:el('email').value,password:el('password').value});if(error){notice('ログインに失敗しました');return}el('password').value='';await enter()};
el('logout').onclick=async()=>{await db.auth.signOut();show('login',true);show('app',false);show('logout',false);notice('ログアウトしました')};
el('refresh').onclick=()=>refresh().catch(e=>notice(e.message));
const {data:{session}}=await db.auth.getSession();if(session)await enter();
const target=new URLSearchParams(location.search).get('id');if(target&&/^[0-9a-f-]{36}$/i.test(target)){const old=detail;detail=async function(id){await old(id)};selected=target;if(session&&rows.some(r=>r.id===target))await detail(target)}
</script></body></html>
